# Integración continua de VetPass: compila y prueba cada producto en cada push
# y en cada pull request. El job final `ci` resume el resultado.
name: CI

on:
  push:
    branches: ['feature/**', 'hotfix/**', 'release/**', develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  backend:
    name: Backend (build, unit, integration, BDD)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('backend/**/*.csproj') }}
      - name: Restore
        run: dotnet restore VetPass.slnx
      # Los analizadores de .NET (sección 6.2.1) corren al compilar; un aviso detiene el pipeline.
      - name: Build
        run: dotnet build VetPass.slnx --no-restore -c Release -warnaserror
      - name: Format
        run: dotnet format VetPass.slnx --no-restore --verify-no-changes
      - name: Test
        run: >
          dotnet test --solution VetPass.slnx --no-build -c Release
          --results-directory TestResults --report-trx
          --coverage --coverage-output-format cobertura
      - name: Test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Backend tests
          path: backend/TestResults/*.trx
          reporter: dotnet-trx
      - name: Coverage summary
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: backend/TestResults/**/*.cobertura.xml
          targetdir: backend/CoverageReport
          reporttypes: MarkdownSummaryGithub;HtmlInline
          assemblyfilters: +VetPass.API
          classfilters: -VetPass.API.Shared.Infrastructure.Persistence.EFC.Migrations.*
      - name: Publish coverage in the job summary
        if: ${{ !cancelled() }}
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: |
            backend/TestResults
            backend/CoverageReport

  web:
    name: Web (unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-application
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-application/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  mobile:
    name: Mobile (analyze, tests, APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-application
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build APK
        run: flutter build apk --release --dart-define=VETPASS_API=https://vetpass-api.vercel.app/api/v1
      - uses: actions/upload-artifact@v7
        with:
          name: vetpass-apk
          path: mobile-application/build/app/outputs/flutter-apk/app-release.apk

  duplication:
    name: Duplication (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Falla si más del 5 % del código está duplicado. Las migraciones y los
      # textos de i18n se excluyen: son generados o datos, no lógica.
      - name: Detect duplicated code
        run: >
          npx --yes jscpd@4 backend/src web-application/src mobile-application/lib landing-page
          --ignore "**/Migrations/**,**/*.test.js,**/i18n/es.js,**/i18n/en.js"
          --min-tokens 50 --threshold 5
          --reporters console,markdown,html --output jscpd-report
      - name: Publish the report in the job summary
        if: ${{ !cancelled() }}
        run: cat jscpd-report/jscpd-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: duplication-report
          path: jscpd-report

  system-web:
    name: System tests (web)
    needs: [backend, web]
    runs-on: ubuntu-latest
    env:
      VETPASS_DEMO_PASSWORD: VetPass.System2026
      VETPASS_API_URL: http://127.0.0.1:5199/api/v1
      VITE_API_URL: http://127.0.0.1:5199/api/v1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/start-backend
        with:
          demo-password: ${{ env.VETPASS_DEMO_PASSWORD }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-application/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: web-application
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: web-application
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web-application/playwright-report

  system-mobile:
    name: System tests (mobile)
    # El emulador tarda: se ejecuta en los pull requests hacia main, y a pedido
    # con «Run workflow» o con [mobile-e2e] en el mensaje del commit.
    if: ${{ github.base_ref == 'main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mobile-e2e]') }}
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    env:
      VETPASS_DEMO_PASSWORD: VetPass.System2026
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/start-backend
        with:
          demo-password: ${{ env.VETPASS_DEMO_PASSWORD }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile-application
      - name: Integration tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: mobile-application
          script: flutter test integration_test --dart-define=VETPASS_API=http://10.0.2.2:5199/api/v1 --dart-define=VETPASS_DEMO_PASSWORD=${{ env.VETPASS_DEMO_PASSWORD }}

  ci:
    name: CI
    if: ${{ always() }}
    needs: [backend, web, mobile, duplication, system-web, system-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Result
        run: |
          echo "backend: ${{ needs.backend.result }} · web: ${{ needs.web.result }} · mobile: ${{ needs.mobile.result }} · duplication: ${{ needs.duplication.result }}"
          echo "system-web: ${{ needs.system-web.result }} · system-mobile: ${{ needs.system-mobile.result }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi
