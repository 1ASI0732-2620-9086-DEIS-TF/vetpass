# Entrega continua del APK: cada etiqueta publica una release de GitHub.
# vX.Y.Z-rc.N queda como pre-release y no cambia la descarga de la última
# versión; vX.Y.Z es la versión final.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  apk:
    name: Publish the APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-application
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Unit and widget tests
        run: flutter test
      - name: Build APK
        run: |
          flutter build apk --release --dart-define=VETPASS_API=https://vetpass-api.vercel.app/api/v1
          mv build/app/outputs/flutter-apk/app-release.apk vetpass.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" vetpass.apk --title "VetPass ${TAG#v}" --generate-notes "${flags[@]}"
