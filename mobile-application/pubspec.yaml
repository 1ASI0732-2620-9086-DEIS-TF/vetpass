name: vetpass_mobile
description: >-
  Aplicación móvil de VetPass para el dueño de la mascota. Interfaz de consulta:
  no permite registrar información clínica.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.1

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Las tipografías viajan dentro de la aplicación y no se descargan en el
  # primer arranque: la identidad del producto no puede depender de que haya
  # red. Ambas son de código abierto bajo la SIL Open Font License, cuyo texto
  # acompaña a los archivos.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
